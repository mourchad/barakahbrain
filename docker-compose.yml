version: '3.9'

services:
  # API Backend
  api:
    build:
      context: ./BarakahBrain-API
      dockerfile: Dockerfile
    container_name: barakahbrain-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      CORS_ORIGIN: http://localhost:3000,http://localhost:5000
      INIT_ADMIN_PWD: ${INIT_ADMIN_PWD:-admin123456}
      DB_PATH: /app/data/database.sqlite
      # SMTP Configuration (optional, set only if needed)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-noreply@barakahbrain.com}
    volumes:
      # Persistent database
      - ./BarakahBrain-API/data:/app/data
      # Optional: reload on code changes (development)
      # - ./BarakahBrain-API/src:/app/src
    networks:
      - barakahbrain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Reverse Proxy (optional, for serving static frontend)
  nginx:
    image: nginx:alpine
    container_name: barakahbrain-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./BarakahBrain:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Optional: SSL certificates
      # - ./certs:/etc/nginx/certs:ro
    networks:
      - barakahbrain-network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  barakahbrain-network:
    driver: bridge

volumes:
  api-data:
    driver: local
