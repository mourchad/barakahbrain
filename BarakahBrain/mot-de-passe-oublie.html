<!DOCTYPE html>
<html lang="fr" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BarakahBrain — Récupération du mot de passe</title>
    <link rel="icon" href="assets/logo_BarakahBrain.png" type="image/png" />
    <link rel="stylesheet" href="assets/styles.css" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
    <meta name="api-base" content="https://barakahbrain-api.onrender.com">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .auth-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .auth-card {
            width: 100%;
            max-width: 28rem;
        }
    </style>
</head>

<body class="bb-bg-pattern">
    <header class="bb-header">
        <a href="index.html" class="bb-header__brand">
            <img src="assets/logo_BarakahBrain.png" alt="BarakahBrain" />
            <span class="bb-header__name">BarakahBrain</span>
        </a>
    </header>

    <div class="auth-wrap">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 2.5rem;">
                <div
                    style="width: 4rem; height: 4rem; background: var(--bb-gold-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;">
                    <span class="material-symbols-outlined"
                        style="color: var(--bb-gold); font-size: 2rem;">lock_reset</span>
                </div>
                <h1
                    style="font-family: var(--font-display); font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem;">
                    Mot de passe oublié ?</h1>
                <p style="color: var(--bb-text-muted); font-size: 0.9375rem;">Entrez votre adresse e-mail pour recevoir
                    un lien de réinitialisation.</p>
            </div>

            <!-- Etape 1 : Saisie de l'email -->
            <form id="step1Form" onsubmit="handleRequestCode(event)">
                <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div>
                        <label class="bb-label" for="reset_email">Votre E-mail</label>
                        <div class="bb-input-wrap">
                            <span class="bb-input-icon material-symbols-outlined">mail</span>
                            <input class="bb-input bb-input--icon" id="reset_email" type="email"
                                placeholder="votre@email.com" required />
                        </div>
                    </div>

                    <button type="submit" class="bb-btn bb-btn-gold bb-btn-full">
                        <span class="material-symbols-outlined">send</span>
                        Envoyer le code
                    </button>
                </div>
            </form>

            <!-- Etape 2 : Saisie du code et nouveau pass (caché par défaut) -->
            <form id="step2Form" onsubmit="handleResetPassword(event)" style="display: none;">
                <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div
                        style="background: rgba(212, 175, 55, 0.05); padding: 1rem; border-radius: var(--bb-radius); border: 1px dashed var(--bb-gold); margin-bottom: 0.5rem;">
                        <p style="font-size: 0.8125rem; color: var(--bb-gold); text-align: center;">
                            Code envoyé ! Consultez votre boîte mail (ou les logs console en démo).
                        </p>
                    </div>

                    <div>
                        <label class="bb-label" for="reset_code">Code de vérification (6 chiffres)</label>
                        <input class="bb-input" id="reset_code" type="text" placeholder="123456" required
                            maxlength="6" />
                    </div>

                    <div>
                        <label class="bb-label" for="new_password">Nouveau mot de passe</label>
                        <input class="bb-input" id="new_password" type="password" placeholder="••••••••" required />
                    </div>

                    <div>
                        <label class="bb-label" for="confirm_password">Confirmer le nouveau passe</label>
                        <input class="bb-input" id="confirm_password" type="password" placeholder="••••••••" required />
                    </div>

                    <button type="submit" class="bb-btn bb-btn-gold bb-btn-full">
                        <span class="material-symbols-outlined">lock_open</span>
                        Réinitialiser mon mot de passe
                    </button>

                    <button type="button" class="bb-btn bb-btn-ghost bb-btn-sm" onclick="showStep(1)">
                        Changer d'adresse e-mail
                    </button>
                </div>
            </form>

            <div style="text-align: center; margin-top: 2rem;">
                <a href="connexion.html" class="bb-btn bb-btn-ghost bb-btn-sm" style="color: var(--bb-text-muted);">
                    <span class="material-symbols-outlined" style="font-size: 1.1rem;">arrow_back</span>
                    Retour à la connexion
                </a>
            </div>
        </div>
    </div>

    <footer style="padding: 1.5rem; text-align: center; border-top: 1px solid var(--bb-border);">
        <p style="font-size: .75rem; color: var(--bb-text-subtle);">© 2025 BarakahBrain. Tous droits réservés.</p>
    </footer>

    <div id="bb-toast"></div>
    <script>
        window.API_BASE = 'https://barakahbrain-api.onrender.com';
    </script>
    <script src="assets/app.js"></script>
    <script>
        let currentEmail = '';

        function showStep(step) {
            document.getElementById('step1Form').style.display = step === 1 ? 'block' : 'none';
            document.getElementById('step2Form').style.display = step === 2 ? 'block' : 'none';
        }

        async function handleRequestCode(e) {
            e.preventDefault();
            const email = document.getElementById('reset_email').value.trim();
            if (!email) return;

            Toast.show('Vérification...', 'info');
            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await res.json();
                if (res.ok) {
                    currentEmail = email;
                    Toast.show(data.message, 'success');
                    showStep(2);
                } else {
                    Toast.show(data.message || 'Erreur', 'error');
                }
            } catch (err) {
                Toast.show('Serveur injoignable', 'error');
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const code = document.getElementById('reset_code').value.trim();
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (newPassword !== confirmPassword) {
                Toast.show('Les mots de passe ne correspondent pas.', 'error');
                return;
            }

            Toast.show('Réinitialisation...', 'info');
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, code, newPassword })
                });

                const data = await res.json();
                if (res.ok) {
                    Toast.show('Mot de passe changé ! Redirection...', 'success');
                    setTimeout(() => window.location.href = 'connexion.html', 2000);
                } else {
                    Toast.show(data.message || 'Erreur', 'error');
                }
            } catch (err) {
                Toast.show('Serveur injoignable', 'error');
            }
        }
    </script>
</body>

</html>
